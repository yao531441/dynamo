apiVersion: v1
kind: Pod
metadata:
  name: xpumd-adapter-test
  namespace: intel-xpumd
  labels:
    app: xpu-smi-exporter
    app.kubernetes.io/name: xpu-smi-exporter
spec:
  restartPolicy: Always
  containers:
  - name: xpumd
    image: ghcr.io/intel/xpumanager/xpumd:v2.0.0-rc.0
    args:
    - --config=/etc/xpumd/config.yaml
    ports:
    - containerPort: 8080
      name: xpumd-metrics
      protocol: TCP
    securityContext:
      privileged: true
      runAsUser: 0
      allowPrivilegeEscalation: true
      capabilities:
        drop:
        - ALL
        add:
        - SYS_ADMIN
    volumeMounts:
    - name: xpumd-config
      mountPath: /etc/xpumd
      readOnly: true
    - name: dri
      mountPath: /dev/dri
    - name: rundir
      mountPath: /run/xpumd
  - name: xpu-exporter
    image: docker.io/library/python:3.10-slim
    command:
    - python3
    - /opt/exporter/xpu_smi_exporter.py
    - --port
    - "9966"
    - --interval
    - "15"
    - --source
    - xpumd
    - --xpumd-endpoint
    - http://127.0.0.1:8080/metrics
    ports:
    - containerPort: 9966
      name: compat-metrics
      protocol: TCP
    env:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    volumeMounts:
    - name: exporter-script
      mountPath: /opt/exporter
      readOnly: true
  volumes:
  - name: xpumd-config
    configMap:
      name: xpumd-config
  - name: exporter-script
    configMap:
      name: xpu-smi-exporter-script
      defaultMode: 0555
  - name: dri
    hostPath:
      path: /dev/dri
      type: Directory
  - name: rundir
    hostPath:
      path: /run/xpumd
      type: DirectoryOrCreate
