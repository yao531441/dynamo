apiVersion: v1
kind: Pod
metadata:
  name: vllm-inference-test-final
  namespace: intel-xpumd
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: emr816613-vm03
  containers:
  - name: vllm-test
    image: "docker.io/library/dynamo:vllm-xpu-base-proxyfix"
    imagePullPolicy: Never
    command:
    - python
    - -c
    - |
      import sys
      print("=" * 60)
      print("Testing vLLM XPU Environment")
      print("=" * 60)
      try:
          import torch
          print(f"✓ PyTorch version: {torch.__version__}")
          if hasattr(torch, 'xpu'):
              print(f"✓ XPU available: {torch.xpu.is_available()}")
              if torch.xpu.is_available():
                  print(f"✓ XPU device count: {torch.xpu.device_count()}")
                  for i in range(torch.xpu.device_count()):
                      print(f"  - Device {i}: {torch.xpu.get_device_name(i)}")
          import vllm
          print(f"✓ vLLM version: {vllm.__version__}")
          print("\n" + "=" * 60)
          print("SUCCESS: All imports work! Ready for inference.")
          print("=" * 60)
      except Exception as e:
          print(f"\n✗ FAILED: {e}")
          import traceback
          traceback.print_exc()
          sys.exit(1)
    resources:
      limits:
        gpu.intel.com/xe: "1"
      requests:
        gpu.intel.com/xe: "1"
    env:
    - name: HF_TOKEN
      valueFrom:
        secretKeyRef:
          name: hf-token-secret
          key: HF_TOKEN
